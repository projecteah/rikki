[package]
name = "rikki"
version = "0.3.0"
description = "A simple notes app"
authors = ["Xun Lee"]
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "rikki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.0.0"

[dependencies]
tauri = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
