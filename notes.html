<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notes</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.18/dist/index.css">
  <style>
    :root {
      --el-color-primary: #00bcd4;
      --el-color-primary-light-3: #4dd0e1;
      --el-color-primary-light-5: #80deea;
      --el-color-primary-light-7: #b2ebf2;
      --el-color-primary-light-8: #e0f7fa;
      --el-color-primary-light-9: #f0fcfd;
      --el-color-primary-dark-2: #0097a7;
    }
  </style>
</head>
<body>
  <div id="app">
    <el-container>
      <el-aside width="200px">
        <el-button type="primary" size="small" @click="newNote" style="margin:10px">+ New</el-button>
        <el-menu :default-active="activeIndex" @select="selectNote">
          <el-menu-item v-for="(note, i) in notes" :key="i" :index="String(i)">
            {{ note.title || 'Untitled' }}
          </el-menu-item>
        </el-menu>
      </el-aside>
      <el-main>
        <el-input v-model="current.title" placeholder="Title" size="large"></el-input>
        <div style="display:flex;gap:4px;margin:8px 0;flex-wrap:wrap">
          <el-button size="small" @click="format('**','**')"><b>B</b></el-button>
          <el-button size="small" @click="format('*','*')"><i>I</i></el-button>
          <el-button size="small" @click="format('# ')">H1</el-button>
          <el-button size="small" @click="format('## ')">H2</el-button>
          <el-button size="small" @click="format('### ')">H3</el-button>
          <el-button size="small" @click="format('- ')">List</el-button>
          <el-button size="small" @click="format('[](url)')">Link</el-button>
          <el-button size="small" @click="format('`','`')">Code</el-button>
          <el-button size="small" @click="format('> ')">Quote</el-button>
        </div>
        <div style="display:flex;gap:10px;height:calc(100vh - 160px)">
          <el-input ref="editor" v-model="current.content" type="textarea" placeholder="Write markdown here..." style="flex:1;height:100%"></el-input>
          <div v-html="rendered" style="flex:1;border:1px solid #ddd;padding:10px;overflow:auto"></div>
        </div>
      </el-main>
    </el-container>
  </div>

  <script src="https://unpkg.com/vue@3.2.40/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.2.18/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/marked@4.1.1/marked.min.js"></script>
  <script>
    const { createApp, ref, computed, watch } = Vue;

    createApp({
      setup() {
        const notes = ref(JSON.parse(localStorage.getItem('notes') || '[{"title":"","content":""}]'));
        const activeIndex = ref('0');
        const editor = ref(null);
        const current = computed(() => notes.value[parseInt(activeIndex.value)] || { title: '', content: '' });
        const rendered = computed(() => marked.parse(current.value.content || ''));

        watch(notes, (val) => localStorage.setItem('notes', JSON.stringify(val)), { deep: true });

        const newNote = () => {
          notes.value.push({ title: '', content: '' });
          activeIndex.value = String(notes.value.length - 1);
        };
        const selectNote = (i) => { activeIndex.value = i; };

        const format = (before, after) => {
          const el = editor.value.textarea;
          const start = el.selectionStart;
          const end = el.selectionEnd;
          const text = current.value.content || '';
          const selected = text.substring(start, end);
          const replacement = before + (selected || 'text') + (after || '');
          current.value.content = text.substring(0, start) + replacement + text.substring(end);
          setTimeout(() => {
            el.focus();
            el.setSelectionRange(start + before.length, start + before.length + (selected ? selected.length : 4));
          });
        };

        return { notes, activeIndex, current, rendered, editor, newNote, selectNote, format };
      },
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
